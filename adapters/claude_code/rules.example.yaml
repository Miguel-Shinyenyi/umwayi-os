# Example rules for the Claude Code adapter (layer 9). Copy the ones you want into
# the rules.yaml of your umwayi root. Every rule here has "platform: claude-code",
# so it only matches tool calls that come through this adapter.
#
# The adapter sends one action per tool call, for example:
#   {"type": "tool_bash", "platform": "claude-code", "tool": "Bash", "command": "npm test"}
#   {"type": "tool_write", "platform": "claude-code", "tool": "Write", "path": "/home/me/p/a.py"}
# See adapters/NOTES.md for every type and field.
#
# Matching is by plain text: "__contains" looks for the text anywhere, ignoring case.
# It is not a shell parser, so a command can be written to get past it. Keep the
# hard limits in Claude Code's own permission deny rules too (see adapters/NOTES.md).
#
# No beats Ask me first, Ask me first beats Yes, and no matching rule is Ask me first.
# A Yes rule here may carry "review_by: YYYY-MM-DD" (layer 13, elections). The rule is
# in force through that day and counts as Ask me first from the next day. It is allowed
# on Yes rules only, and only once the version with elections is installed: older code
# calls it an unknown field and every check gives Ask me first. "umwayi rules due"
# lists the rules that lapsed or are due.
rules:
  # --- never: money, publishing, pushing to main (the same safety rules as umwayi itself)
  - id: cc-no-money
    title: Claude Code never moves money
    text: AI helpers never move money or use bank or card credentials.
    cause: Safety rule for all AI helpers.
    verdict: no
    matchers:
      platform: claude-code
      command__contains: [stripe , paypal, "/payments", "card_number"]

  - id: cc-no-push-main
    title: Claude Code never pushes to main
    text: Nothing is pushed to the main branch. Work on a feature branch and open a pull request.
    cause: Safety rule for this repo.
    verdict: no
    matchers:
      platform: claude-code
      type: tool_bash
      command__contains: ["git push origin main", "git push origin master", "git push -f", "git push --force"]

  - id: cc-no-destroy
    title: No destructive shell commands
    text: Commands that delete trees, wipe disks or change permissions widely are refused.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]
      command__contains: ["rm -rf", "rm -fr", "mkfs", "dd if=", "chmod -r 777", "remove-item -recurse"]

  # --- never: the files that guard the AI helper (rules, logbook, kill switch, hook settings)
  - id: cc-no-guard-edits
    title: Claude Code never edits the files that guard it
    text: rules.yaml, LOGBOOK.md, .umwayi/ and .claude/settings files are changed by the owner only.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_write, tool_edit, tool_multiedit, tool_notebookedit]
      path__contains: ["rules.yaml", "logbook.md", "/.umwayi/", "/.claude/settings", "/.git/"]

  # umwayi petition (layer 13) is left to the owner: an AI helper may object to a No this way. To refuse it,
  # add "umwayi petition" to the list below.
  - id: cc-no-guard-shell
    title: Shell commands that touch the guard files
    text: Shell commands that name rules.yaml, LOGBOOK.md, .umwayi, .claude/settings, umwayi kill, umwayi decision or decision reopen are refused.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]
      command__contains: ["rules.yaml", "logbook.md", ".umwayi", ".claude/settings", "umwayi kill", "umwayi decision", "decision reopen"]

  - id: cc-no-secrets
    title: No reading of secret files
    text: Files that usually hold secrets are not read by an AI helper.
    verdict: no
    matchers:
      platform: claude-code
      path__contains: [".env", ".pem", "id_rsa", "id_ed25519", ".aws/credentials", ".netrc"]

  # --- yes: reading and searching inside the project
  - id: cc-read
    title: Claude Code may read and search
    text: Reading and searching files is allowed.
    verdict: yes
    matchers:
      platform: claude-code
      type: [tool_read, tool_glob, tool_grep]

  # --- ask me first: writing, running commands, the web, MCP tools, subagents
  - id: cc-ask-write
    title: Writing a file needs the owner
    text: The owner confirms every file write or edit.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_write, tool_edit, tool_multiedit, tool_notebookedit]

  - id: cc-ask-shell
    title: Shell commands need the owner
    text: The owner confirms every shell command.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]

  - id: cc-ask-web
    title: The web needs the owner
    text: The owner confirms every web fetch and web search.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_webfetch, tool_websearch]

  # Anything else (MCP tools, subagents, new tools) matches no rule: Ask me first.
