# Example rules for the generic stdin and stdout adapter (layer 9).
# The platform name is what you pass with --platform (default: stdio).
# The adapter sends {"type": "tool_" + tool_name, "platform": NAME, "tool": tool_name,
# "input_<key>": value for every top level string field of tool_input}.
rules:
  - id: stdio-read
    title: Reading is fine
    text: Reading is allowed.
    verdict: yes
    matchers:
      platform: stdio
      type: tool_read

  - id: stdio-ask-deploy
    title: Deploys need the owner
    text: The owner confirms every deploy.
    verdict: ask
    matchers:
      platform: stdio
      type: tool_deploy

  - id: stdio-no-prod
    title: Never production
    text: Nothing is deployed to production by an AI helper.
    verdict: no
    matchers:
      platform: stdio
      input_target__contains: [prod]

  # Layer 13: reopening a decision is the owner's act (13.R14.3).
  - id: stdio-no-owner-commands
    title: Owner commands of layer 13
    text: Shell commands that run umwayi decision (or name decision reopen) are refused.
    cause: Only the owner reopens a decision.
    verdict: no
    matchers:
      platform: stdio
      input_command__contains: ["umwayi decision", "decision reopen"]
