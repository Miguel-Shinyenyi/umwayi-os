# umwayi rules. verdict is one of: yes, no, ask.
# If several rules match, No beats Ask me first, and Ask me first beats Yes.
# No match gives Ask me first. A rule without matchers never matches.
rules:
  - id: no-money
    title: Never move money
    text: AI helpers never move money or use bank or card credentials.
    cause: Safety rule for all AI helpers.
    verdict: no
    matchers:
      type: [payment, transfer, purchase, withdraw, deposit]

  - id: no-money-amount
    title: Any action with an amount
    text: Actions that carry an amount are about money, so they are refused.
    cause: Safety rule for all AI helpers.
    verdict: no
    matchers:
      amount__exists: true

  - id: no-push-main
    title: Never push to main
    text: Nothing is pushed to the main branch.
    cause: Work happens on feature branches with pull requests.
    verdict: no
    matchers:
      type: git_push
      branch: [main, master]

  - id: no-publish
    title: Helpers never publish
    text: AI helpers draft only. The owner publishes.
    cause: Helpers draft only.
    verdict: no
    matchers:
      type: [publish, post, send]

  - id: read-memory
    title: Reading memory is fine
    text: Reading the memory folder through the loader is allowed.
    verdict: yes
    matchers:
      type: read_memory

  - id: write-draft
    title: Drafts are fine
    text: Writing a draft file is allowed. The owner reviews it.
    verdict: yes
    matchers:
      type: write_draft

  - id: run-safe-jobs
    title: Scheduled jobs that only read or draft
    text: The report, check and queue-list jobs only read files or write a new draft.
    cause: Layer 6 runs only commands from the allow list inside umwayi.
    verdict: yes
    matchers:
      type: run_job
      command: [report, check, queue-list]

  - id: publish-ask
    title: Publishing a draft needs the owner
    text: Publishing is Ask me first. The owner approves it, then posts the copy in outbox by hand.
    cause: Helpers draft only.
    verdict: ask
    matchers:
      type: publish_draft

  # Scheduled runs (layer 11). Installing a schedule makes a job or workflow run on its own; removing one is the
  # safe direction. The runs themselves still ask the rules (run_job, workflow_step) every time.
  - id: schedule-install-ask
    title: Installing a schedule needs the owner
    text: A schedule makes a job or a workflow run on its own. The owner approves it with --approved-by NAME.
    cause: Nothing runs on its own unless the owner says so.
    verdict: ask
    matchers:
      type: schedule_install

  - id: schedule-remove-yes
    title: Removing a schedule is fine
    text: Removing a schedule only stops a job or a workflow from running on its own.
    cause: Taking automation away is the safe direction.
    verdict: yes
    matchers:
      type: schedule_remove

  # AI helpers (layer 7). Every helper action has a "helper" field.
  - id: helper-read
    title: AI helpers may read
    text: An AI helper may read the queue, the logbook or one local article.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      helper__exists: true
      type: [read_queue, read_logbook, read_article]

  - id: helper-draft
    title: AI helpers may write drafts
    text: An AI helper may write a new draft under drafts. The owner reviews it.
    cause: Helpers draft only.
    verdict: yes
    matchers:
      helper__exists: true
      type: write_draft

  - id: helper-no-post
    title: AI helpers never post, send or publish
    text: An AI helper never posts, sends or publishes. The owner publishes by hand.
    cause: Helpers draft only.
    verdict: no
    matchers:
      helper__exists: true
      type__contains: [post, send, publish]

  - id: helper-no-post-command
    title: No AI helper step may run a post, send or publish command
    text: An AI helper or workflow step never runs a command that posts, sends or publishes.
    cause: Helpers draft only.
    verdict: no
    matchers:
      helper__exists: true
      command__contains: [post, send, publish]

  # Workflows (layer 8). The runner is the helper "workflow"; each step names its command.
  - id: workflow-steps
    title: Workflow steps from the allow list
    text: A workflow may run its fixed steps. They only read, write drafts or ask the owner.
    cause: Layer 8 runs only steps from the allow list inside umwayi.
    verdict: yes
    matchers:
      helper: workflow
      type: workflow_step
      command: [queue-list, steward, social-draft, report, check, approve]

  # Starter rules for the actions the adapters send (layer 9, task 9.10). The source is the example file in each
  # adapter folder (adapters/claude_code, adapters/kiro, adapters/stdio). The ids, verdicts and matchers are the
  # same as in the examples. The rules whose id ends in "secrets" for Kiro and stdio are added here, because the
  # examples have no rule for secret files on those two. Every rule names its platform, so a rule for one platform
  # never answers for another. An action that no rule names is Ask me first. See docs/rules.md.

  # --- Claude Code: never
  - id: cc-no-money
    title: Claude Code never moves money
    text: An AI helper never moves money or uses bank or card details. A command that names a payment service is refused.
    cause: Safety rule for all AI helpers.
    verdict: no
    matchers:
      platform: claude-code
      command__contains: ["stripe ", paypal, "/payments", card_number]

  - id: cc-no-push-main
    title: Claude Code never pushes to main
    text: Nothing is pushed to the main branch, and no push is forced. Work on a feature branch and open a pull request.
    cause: Work happens on feature branches with pull requests.
    verdict: no
    matchers:
      platform: claude-code
      type: tool_bash
      command__contains: ["git push origin main", "git push origin master", "git push -f", "git push --force"]

  - id: cc-no-destroy
    title: Claude Code never runs commands that wipe things
    text: Commands that delete whole folders, wipe a disk or open up permissions for everyone are refused.
    cause: These cannot be undone.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]
      command__contains: ["rm -rf", "rm -fr", "mkfs", "dd if=", "chmod -r 777", "remove-item -recurse"]

  - id: cc-no-guard-edits
    title: Claude Code never edits the files that guard it
    text: Only the owner changes rules.yaml, autonomy.yaml, LOGBOOK.md, the .umwayi folder, the .git folder and the Claude Code settings.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_write, tool_edit, tool_multiedit, tool_notebookedit]
      path__contains: ["rules.yaml", "logbook.md", "/.umwayi/", "/.claude/settings", "/.git/", "autonomy.yaml", "autonomy.example.yaml"]

  - id: cc-no-guard-shell
    title: Claude Code shell commands never touch the guard files
    text: A shell command that names rules.yaml, LOGBOOK.md, .umwayi, the Claude Code settings, umwayi kill, umwayi serve, serve.token, umwayi decision, decision reopen, umwayi autonomy, autonomy record or autonomy.yaml is refused.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]
      command__contains: ["rules.yaml", "logbook.md", ".umwayi", ".claude/settings", "umwayi kill", "umwayi serve", "serve.token", "umwayi decision", "decision reopen", "umwayi autonomy", "autonomy record", "autonomy.yaml", "autonomy.example.yaml"]

  - id: cc-no-secrets
    title: Claude Code never touches secret files
    text: Files that usually hold passwords or keys are not read or changed by an AI helper.
    cause: A secret that is read can end up in a log or a reply.
    verdict: no
    matchers:
      platform: claude-code
      path__contains: [".env", ".pem", "id_rsa", "id_ed25519", ".aws/credentials", ".netrc", "serve.token"]

  # --- Claude Code: reading and listing is fine
  - id: cc-read
    title: Claude Code may read and search
    text: Reading files and searching for files or text is allowed.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      platform: claude-code
      type: [tool_read, tool_glob, tool_grep]

  # --- Claude Code: the owner decides
  - id: cc-ask-write
    title: Claude Code writing a file needs the owner
    text: The owner confirms every file write or edit.
    cause: A changed file is hard to take back without notice.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_write, tool_edit, tool_multiedit, tool_notebookedit]

  - id: cc-ask-shell
    title: Claude Code shell commands need the owner
    text: The owner confirms every shell command. This covers deleting, installing, publishing and sending.
    cause: A shell command can do anything, so the owner looks first.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_bash, tool_powershell]

  - id: cc-ask-web
    title: Claude Code using the web needs the owner
    text: The owner confirms every web page fetch and every web search.
    cause: A web request sends text out of this computer.
    verdict: ask
    matchers:
      platform: claude-code
      type: [tool_webfetch, tool_websearch]

  # --- Kiro: reading and listing is fine
  - id: kiro-read
    title: Kiro may read and search
    text: Reading files and searching for text is allowed.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      platform: kiro
      type: [tool_read_file, tool_grep_search]

  # --- Kiro: the owner decides. Kiro cannot ask, so the call is refused and one item waits in the queue.
  - id: kiro-ask-write
    title: Kiro writing or deleting a file needs the owner
    text: The owner confirms every file write, edit or delete.
    cause: A changed or deleted file is hard to take back without notice.
    verdict: ask
    matchers:
      platform: kiro
      type: [tool_fs_write, tool_fs_append, tool_str_replace, tool_delete_file]

  - id: kiro-ask-shell
    title: Kiro shell commands need the owner
    text: The owner confirms every shell command. This covers deleting, installing, publishing and sending.
    cause: A shell command can do anything, so the owner looks first.
    verdict: ask
    matchers:
      platform: kiro
      type: [tool_execute_bash, tool_execute_pwsh]

  # --- Kiro: never. Kiro does not document the field names inside a tool call. The adapter sends each text field
  # as input_NAME, and these rules assume input_command and input_path. See adapters/kiro/README.md.
  - id: kiro-no-destroy
    title: Kiro never runs commands that wipe things
    text: Commands that delete whole folders or wipe a disk are refused.
    cause: These cannot be undone.
    verdict: no
    matchers:
      platform: kiro
      input_command__contains: ["rm -rf", "rm -fr", "mkfs", "dd if=", "remove-item -recurse"]

  - id: kiro-no-guard-shell
    title: Kiro shell commands never touch the guard files
    text: A shell command that names rules.yaml, LOGBOOK.md, .umwayi, the Kiro hooks, umwayi kill, umwayi serve, serve.token, umwayi decision, decision reopen, umwayi autonomy, autonomy record or autonomy.yaml is refused.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: kiro
      input_command__contains: ["rules.yaml", "logbook.md", ".umwayi", ".kiro/hooks", "umwayi kill", "umwayi serve", "serve.token", "umwayi decision", "decision reopen", "umwayi autonomy", "autonomy record", "autonomy.yaml", "autonomy.example.yaml"]

  - id: kiro-no-guard-edits
    title: Kiro never edits the files that guard it
    text: Only the owner changes rules.yaml, autonomy.yaml, LOGBOOK.md, the .umwayi folder and the Kiro hooks.
    cause: An AI helper must not turn off its own rules, logbook or hook.
    verdict: no
    matchers:
      platform: kiro
      input_path__contains: ["rules.yaml", "logbook.md", ".umwayi/", ".kiro/hooks", "autonomy.yaml", "autonomy.example.yaml"]

  - id: kiro-no-secrets
    title: Kiro never touches secret files
    text: Files that usually hold passwords or keys are not read or changed by an AI helper.
    cause: A secret that is read can end up in a log or a reply.
    verdict: no
    matchers:
      platform: kiro
      input_path__contains: [".env", ".pem", "id_rsa", "id_ed25519", ".aws/credentials", ".netrc", "serve.token"]

  # --- Generic stdin and stdout adapter (platform name stdio, the default of --platform)
  - id: stdio-read
    title: Reading is fine
    text: Reading is allowed.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      platform: stdio
      type: tool_read

  - id: stdio-ask-deploy
    title: Deploys need the owner
    text: The owner confirms every deploy.
    cause: A deploy changes something other people use.
    verdict: ask
    matchers:
      platform: stdio
      type: tool_deploy

  - id: stdio-no-prod
    title: Never production
    text: An AI helper never deploys to production.
    cause: Production is used by real people, so only the owner touches it.
    verdict: no
    matchers:
      platform: stdio
      input_target__contains: [prod]

  - id: stdio-no-owner-commands
    title: Owner commands of layer 13
    text: A shell command that runs umwayi decision or umwayi autonomy, or names decision reopen, autonomy record or autonomy.yaml, is refused.
    cause: Only the owner reopens a decision, records an outcome or changes autonomy.yaml.
    verdict: no
    matchers:
      platform: stdio
      input_command__contains: ["umwayi decision", "decision reopen", "umwayi autonomy", "autonomy record", "autonomy.yaml", "autonomy.example.yaml"]

  - id: stdio-no-secrets
    title: Never secret files
    text: Files that usually hold passwords or keys are not read or changed by an AI helper.
    cause: A secret that is read can end up in a log or a reply.
    verdict: no
    matchers:
      platform: stdio
      input_path__contains: [".env", ".pem", "id_rsa", "id_ed25519", ".aws/credentials", ".netrc", "serve.token"]

  # Starter rules for OpenCode (layer 10 part 8, task 10.45; added to this file in the pull request "OpenCode starter
  # rules", the same job 9.10 did for the other three adapters). The source is adapters/opencode/rules.example.yaml:
  # the 13 rules below have the same ids, verdicts, matchers and words as the example. Every rule names
  # "platform: opencode", so a rule for OpenCode never answers for another platform, and none of the rules above is
  # touched by them. An action that no rule names is Ask me first. See docs/rules.md and adapters/NOTES-layer10.md (OpenCode 2.2.7).
  # --- OpenCode: never. Money, pushing to main, destroying things.
  - id: oc-no-money
    title: OpenCode never moves money
    text: An AI helper never moves money or uses bank or card details. A command that names a payment service is refused.
    cause: Safety rule for all AI helpers.
    verdict: no
    matchers:
      platform: opencode
      input_command__contains: ["stripe ", paypal, "/payments", card_number]

  - id: oc-no-push-main
    title: OpenCode never pushes to main
    text: Nothing is pushed to the main branch, and no push is forced. Work on a feature branch and open a pull request.
    cause: Work happens on feature branches with pull requests.
    verdict: no
    matchers:
      platform: opencode
      type: tool_shell
      input_command__contains: ["git push origin main", "git push origin master", "git push -f", "git push --force"]

  - id: oc-no-destroy
    title: OpenCode never runs commands that wipe things
    text: Commands that delete whole folders, wipe a disk or open up permissions for everyone are refused.
    cause: These cannot be undone.
    verdict: no
    matchers:
      platform: opencode
      type: tool_shell
      input_command__contains: ["rm -rf", "rm -fr", "mkfs", "dd if=", "chmod -r 777"]

  # --- OpenCode: never. The files that guard the AI helper (rules, logbook, kill switch, OpenCode's own configuration).
  - id: oc-no-guard-edits
    title: OpenCode never edits the files that guard it
    text: Only the owner changes rules.yaml, autonomy.yaml, LOGBOOK.md, the .umwayi folder, the .git folder and OpenCode's own configuration (opencode.json, opencode.jsonc and the .opencode folder).
    cause: An AI helper must not turn off its own rules, logbook or gate, or add a plugin or a policy while it runs.
    verdict: no
    matchers:
      platform: opencode
      type: [tool_write, tool_edit]
      input_path__contains: ["rules.yaml", "logbook.md", ".umwayi/", "opencode.json", ".opencode", ".git/", "autonomy.yaml", "autonomy.example.yaml"]

  # umwayi petition (layer 13) is left to the owner: an AI helper may object to a No this way. To refuse it,
  # add "umwayi petition" to the list below.
  - id: oc-no-guard-shell
    title: OpenCode shell commands never touch the guard files
    text: A shell command that names rules.yaml, autonomy.yaml, LOGBOOK.md, .umwayi, opencode.json, opencode.jsonc, .opencode, umwayi kill, umwayi serve, serve.token, umwayi decision, decision reopen, umwayi autonomy or autonomy record is refused.
    cause: An AI helper must not turn off its own rules, logbook or gate, or add a plugin or a policy while it runs.
    verdict: no
    matchers:
      platform: opencode
      type: tool_shell
      input_command__contains: ["rules.yaml", "logbook.md", ".umwayi", "opencode.json", ".opencode", "umwayi kill", "umwayi serve", "serve.token", "umwayi decision", "decision reopen", "umwayi autonomy", "autonomy record", "autonomy.yaml", "autonomy.example.yaml"]

  - id: oc-no-secrets
    title: OpenCode never touches secret files
    text: Files that usually hold passwords or keys are not read or changed by an AI helper.
    cause: A secret that is read can end up in a log or a reply.
    verdict: no
    matchers:
      platform: opencode
      input_path__contains: [".env", ".pem", "id_rsa", "id_ed25519", ".aws/credentials", ".netrc", "serve.token"]

  # --- OpenCode: reading and listing is fine
  - id: oc-read
    title: OpenCode may read and search
    text: Reading files and searching for files or text is allowed.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      platform: opencode
      type: [tool_read, tool_glob, tool_grep]

  # --- OpenCode: the owner decides. Writing, shell commands, the web, helpers that start helpers.
  - id: oc-ask-write
    title: OpenCode writing a file needs the owner
    text: The owner confirms every file write or edit.
    cause: A changed file is hard to take back without notice.
    verdict: ask
    matchers:
      platform: opencode
      type: [tool_write, tool_edit]

  - id: oc-ask-shell
    title: OpenCode shell commands need the owner
    text: The owner confirms every shell command. This covers deleting, installing, publishing and sending.
    cause: A shell command can do anything, so the owner looks first.
    verdict: ask
    matchers:
      platform: opencode
      type: tool_shell

  - id: oc-ask-web
    title: OpenCode using the web needs the owner
    text: The owner confirms every web page fetch.
    cause: A web request sends text out of this computer.
    verdict: ask
    matchers:
      platform: opencode
      type: tool_webfetch

  - id: oc-ask-agent
    title: OpenCode starting a helper or asking a question needs the owner
    text: The owner confirms every sub agent and every question the model wants to put to someone.
    cause: A sub agent runs its own tool calls, and a question can be answered by no one in this chat.
    verdict: ask
    matchers:
      platform: opencode
      type: [tool_subagent, tool_question]

  # --- OpenCode: Code Mode has no rule here on purpose. It is JavaScript that OpenCode runs for the model: the "execute" tool,
  # which can fetch web pages, and the "opencode_*" tools it can call (worktree_create, worktree_remove,
  # session_move and others). None of them asks permission, so these rules are the only check. With no rule they are
  # Ask me first, and the first gate stops them (the type is tool_execute, or tool_opencode_ and the name). Do not
  # add an Ask rule for them: Ask me first beats Yes, so a Yes rule of yours could then never take effect. To allow
  # one, write a Yes rule for its type, for example:
  #
  #   - id: owner-yes-worktree-list
  #     title: Listing worktrees is fine
  #     text: OpenCode may list the worktrees of a repository.
  #     cause: Listing changes nothing.
  #     verdict: yes
  #     matchers:
  #       platform: opencode
  #       type: tool_opencode_worktree_list

  # --- OpenCode: the permission request (the second gate). Only the kind is known here, never the path or the command.
  - id: oc-perm-read
    title: OpenCode permission requests to read or search are fine
    text: A request to read a file or to search is answered with once. The first gate has already looked at the path.
    cause: Reading changes nothing.
    verdict: yes
    matchers:
      platform: opencode
      type: acp_permission
      kind: [read, search]

  - id: oc-perm-ask
    title: OpenCode permission requests to change, run, fetch or think need the owner
    text: A request to edit, delete, move, run a command, fetch a page, think or switch mode is put to the owner.
    cause: The owner confirms what changes things or sends text out.
    verdict: ask
    matchers:
      platform: opencode
      type: acp_permission
      kind: [edit, delete, move, execute, think, fetch, switch_mode, other]
