# Example rules for goal orchestration (`umwayi goal`, W9, requirement W9.R22.4). Copy the rules you want into the
# rules.yaml of your umwayi root. This file is not read by umwayi.
#
# Every start of an AI helper by a goal (the guide's planning run, a builder, a tester, the guide's check) first asks
# the rules with one action, built by umwayi from ids and names and never from the packet text:
#   {"type": "goal_start", "goal": "G-0007", "task": "T-02", "role": "builder", "agent": "claude-build",
#    "platform": "claude-code", "budget_uu": 30}
# The planning run uses "task": "plan" and "role": "guide". The role is guide, builder, tester or check.
#
# With no rule that matches, the answer is Ask me first: the task needs you (reason ask) and one queue item says so.
# Answering that item starts nothing; a Yes rule for goal_start is what lets the start go on. Then `agent run` asks
# `agent_run` and `budget_check` itself, as for every run, so those rules are needed too.
#
# Read these before you copy them:
#   * Nothing here is Yes by default: the only rule is a commented example.
#   * `goal_start` can never be moved to Yes by graded autonomy (it is on the never list of umwayi/rules.py).
#   * A No rule for goal_start stops the task (reason owner) and the goal halts.
#   * A Yes rule may carry "review_by: YYYY-MM-DD" (layer 13, elections): past that day it counts as Ask me first.
rules: []

# An example that allows the three roles for named agents only (remove the leading "# " of each line to use it):
#
# rules:
#   - id: goal-start-named-agents
#     title: These agents may work on goals
#     text: The guide, the builder and the tester of my goals may start, for these agents only.
#     verdict: yes
#     matchers:
#       type: goal_start
#       agent: [claude-guide, claude-build, kiro-test]
#       role: [guide, builder, tester, check]

# Publishing a finished task (docs/goal-publish-design.md, step 1): the action `goal_publish` is asked before a later step may push a task
# branch and open a draft pull request. It is built from ids and names only:
#   {"type": "goal_publish", "goal": "G-0002", "task": "T-01", "repo": "owner/name", "branch": "umwayi/g-0002-t-01"}
# Nothing here is Yes by default. With no rule the answer is Ask me first and nothing is published. `goal_publish` is on the never list of
# graded autonomy. Step 1 only builds and asks (umwayi/goalpublish.py); no push exists yet. An example for one repo of yours:
#
# rules:
#   - id: publish-my-project
#     title: Publish task branches of my project
#     text: A finished task branch of this repo may be pushed and opened as a draft pull request.
#     verdict: yes
#     matchers:
#       type: goal_publish
#       repo: [owner/name]

# Builder rules (W57): let a Claude Code builder work inside the goal worktrees without asking you for each step.
# Copy them once into the rules.yaml of the umwayi root that runs your goals, and put your own worktree root in place
# of /path/to/umwayi-root-worktrees (umwayi makes it next to the root, with "-worktrees" added to the root's name).
#
# Read these before you copy them:
#   * Take the starter rules cc-ask-write and cc-ask-shell out of that rules.yaml. Ask me first beats Yes, so while
#     they are there every builder write and shell command is still asked, and the Yes rules below do nothing. With
#     them gone, a write or a command these rules do not allow still gets Ask me first, because no rule matches.
#   * Keep every No starter rule (cc-no-push-main, cc-no-destroy, cc-no-guard-edits, cc-no-guard-shell, cc-no-secrets,
#     cc-no-money). No beats Yes, so they still stop a write to .git, a secret path or a push to main.
#   * These rules are for Claude Code only. They need `cwd`, the folder the tool call runs in, which only the Claude
#     Code hook puts in the action. Without `cwd` none of them matches, so the answer stays Ask me first.
#   * `command__startswith` takes one printable line: a command with a newline or a tab never matches it. Matching is
#     plain text and not a shell parser, so keep the No rule for the chain characters with the Yes rules. Each value
#     ends with a space, so "git diff " does not allow "git difftool"; builder-shell-bare allows the five written alone.
#   * `path__prefix` and `cwd__prefix` take a clean absolute path only (no ".", ".." or "//"). A link is not resolved:
#     a link inside the worktree that points outside it is matched by where it sits, not by where it points.
#
# rules:
#   - id: builder-no-chain
#     title: A builder shell command runs one command only
#     text: A shell command in a goal worktree may not chain, pipe, run in the background, substitute or redirect.
#     cause: A chain character would let a second command ride on an allowed one.
#     verdict: no
#     matchers:
#       platform: claude-code
#       type: tool_bash
#       cwd__prefix: /path/to/umwayi-root-worktrees
#       command__contains: ["&", ";", "|", "`", "$(", ">"]
#
#   - id: builder-no-git-output
#     title: A builder git diff writes no file
#     text: git diff --output writes a file anywhere, so it is not allowed in a goal worktree.
#     verdict: no
#     matchers:
#       platform: claude-code
#       type: tool_bash
#       cwd__prefix: /path/to/umwayi-root-worktrees
#       command__contains: "--output"
#
#   - id: builder-write
#     title: A builder may write files in a goal worktree
#     text: Writing and editing files inside the goal worktrees is allowed.
#     verdict: yes
#     matchers:
#       platform: claude-code
#       type: [tool_write, tool_edit, tool_multiedit]
#       cwd__prefix: /path/to/umwayi-root-worktrees
#       path__prefix: /path/to/umwayi-root-worktrees
#
#   - id: builder-shell
#     title: A builder may run five commands in a goal worktree
#     text: git status, git diff, git add, git commit and python3 -m unittest are allowed in the goal worktrees.
#     verdict: yes
#     matchers:
#       platform: claude-code
#       type: tool_bash
#       cwd__prefix: /path/to/umwayi-root-worktrees
#       command__startswith: ["git status ", "git diff ", "git add ", "git commit ", "python3 -m unittest "]
#
#   - id: builder-shell-bare
#     title: The same five commands with nothing after them
#     text: The five commands of builder-shell, written alone, are allowed in the goal worktrees.
#     verdict: yes
#     matchers:
#       platform: claude-code
#       type: tool_bash
#       cwd__prefix: /path/to/umwayi-root-worktrees
#       command: ["git status", "git diff", "git add", "git commit", "python3 -m unittest"]
