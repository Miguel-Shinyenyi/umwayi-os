    source: ".kiro/specs/umwayi-os/requirements.md#W9.R4#3"
    text: "Every task has a goal in one sentence."
    kind: enforce
    check: goal_sentence_present
    applies_to: task
    tier: 3
    source_hash: "b81c210d47cb0ad02ec0185988f89b0a09fb978f9100d2cb222f13b0658f86b2"
  - id: one-open-pr-per-task
    source: ".kiro/steering/builder-workflow.md#1"
    text: "A task has at most one open pull request."
    kind: enforce
    check: one_open_pr
    applies_to: pr
    tier: 4
