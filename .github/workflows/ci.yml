name: tests

# W20: faster CI without losing coverage. Four jobs.
#   plan   always runs. It reads the diff and decides which test jobs run (python -m tools.ci_plan). A push to main, an
#          unreadable or empty diff, a changed workflow, filter, map or shard file, and any path it does not know run
#          everything.
#   test   the Python suite, split into shards by test file (tools/ci_shards.json) on each Python version the plan names.
#          W24: a pull request runs Python 3.10 and 3.13 only; a push to main runs 3.10, 3.11, 3.12 and 3.13. The
#          versions are chosen in the plan step (tools/ci_plan.py), never in this file, so the matrix, the jobs and the
#          check of result always agree. 3.11 and 3.12 therefore run only after a merge.
#   node   the Node tests of ui/ and site/, only when the plan says so.
#   result always runs, after the other three. It is the one check to require: it fails when a planned job failed, did
#          not run or was cancelled, when a shard has no report, and when the shards together did not run every test
#          that discovery found in the files the plan selected. A job the plan skipped on purpose is listed in its
#          summary as NOT RUN, so a skipped job is never shown as a pass of something that did not run.
# The checks (names) are listed in docs/testing.md and in the pull request that introduced this file.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run of that pull request (CI.1). A push to main has its own group
# (the commit) and is never cancelled: every push to main runs the full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      python: ${{ steps.plan.outputs.python }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide which tests run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            python -m tools.ci_plan --event "$EVENT" --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python -m tools.ci_plan --event "$EVENT" --github-output "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.python-version }}, shard ${{ matrix.shard }}/${{ matrix.of }})
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests of this shard
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python -m tools.ci_shards run --shard ${{ matrix.shard }} --python-version ${{ matrix.python-version }} --report reports/report-${{ matrix.python-version }}-${{ matrix.shard }}.json
      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.python-version }}-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error

  node:
    name: node
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The npm download cache of the two Node test steps below. It holds what npm downloads, never node_modules, and
      # `npm ci --ignore-scripts` still runs from the lockfiles. It uses the Node the runner already has.
      - name: Cache the npm download of ui/ and site/
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json', 'site/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Node tests of ui/ and site/
        # CI.2: a runner without Chrome fails the phone tests of both folders instead of skipping them.
        env:
          UMWAYI_REQUIRE_BROWSER: "1"
        run: |
          set -e
          (cd ui && npm ci --ignore-scripts && node --test)
          (cd site && npm ci --ignore-scripts && node --test)

  result:
    name: result
    needs: [plan, test, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # If no shard ran there is nothing to download; the check below then decides whether that is allowed.
      - name: Download the shard reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Check that every planned job ran and every test ran
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          NODE_RESULT: ${{ needs.node.result }}
        run: python -m tools.ci_shards verify --reports reports
